# Default values for open5gs-5gcore-helm (Open5GS v2.8.0)

open5gs:
  image:
    repository: quay.io/asonmez/open5gs-aio
    pullPolicy: IfNotPresent
    tag: "v2.8.0"

webui:
  image:
    repository: quay.io/asonmez/open5gs-aio
    pullPolicy: IfNotPresent
    tag: "webui-v2.8.0"
  ingress:
    enabled: false
    hosts:
      - name: open5gs-epc.local
        paths: ["/"]
        tls: false

# MongoDB: default emptyDir at /data/db. Set persistence.enabled=true to create
# PVC open5gs-mongodb-data, or set existingClaim. See README persistence examples.
mongodb:
  image:
    repository: mongo
    tag: "6.0"
    pullPolicy: IfNotPresent
  persistence:
    enabled: false
    existingClaim: ""
    storageClass: ""
    size: 8Gi
    accessModes:
      - ReadWriteOnce
    volumeName: ""
    mountPath: /data/db

# Prometheus metrics served by AMF/SMF/PCF/UPF at /metrics
metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    enabled: true
    interval: 15s

bsf:
  enabled: true

dnn: internet

amf:
  mcc: 208
  mnc: 93
  tac: 7

# Primary/Native kubernetes interface
k8s:
  interface: eth0
  advertise: 192.168.50.200

netattchdefinition: testuserplane
