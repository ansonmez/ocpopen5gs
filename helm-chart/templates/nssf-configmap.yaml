apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-nssf-config
  labels:
    epc-mode: nssf
data:
  nssf.yaml: |
    logger:
      file:
        path: /var/log/open5gs/nssf.log
    global:
      max:
        ue: 1024
    nssf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
            advertise: open5gs-nssf
        client:
          nrf:
            - uri: http://open5gs-nrf:7777
          nsi:
            - uri: http://open5gs-nrf:7777
              s_nssai:
                sst: 1
