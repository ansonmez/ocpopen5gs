apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-amf-config
  labels:
    epc-mode: amf
data:
  amf.yaml: |
    logger:
      file:
        path: /var/log/open5gs/amf.log
    global:
      max:
        ue: 1024
    amf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
            advertise: open5gs-amf
        client:
          nrf:
            - uri: http://open5gs-nrf:7777
      ngap:
        server:
          - dev: {{ .Values.k8s.interface }}
      {{- if .Values.metrics.enabled }}
      metrics:
        server:
          - address: 0.0.0.0
            port: {{ .Values.metrics.port }}
      {{- end }}
      guami:
        - plmn_id:
            mcc: {{ .Values.amf.mcc }}
            mnc: {{ .Values.amf.mnc }}
          amf_id:
            region: 2
            set: 1
      tai:
        - plmn_id:
            mcc: {{ .Values.amf.mcc }}
            mnc: {{ .Values.amf.mnc }}
          tac: {{ .Values.amf.tac }}
      plmn_support:
        - plmn_id:
            mcc: {{ .Values.amf.mcc }}
            mnc: {{ .Values.amf.mnc }}
          s_nssai:
            - sst: 1
      security:
        integrity_order: [ NIA2, NIA1, NIA0 ]
        ciphering_order: [ NEA0, NEA1, NEA2 ]
      network_name:
        full: Open5GS
        short: Next
      amf_name: open5gs-amf0
      time:
        t3512:
          value: 540
