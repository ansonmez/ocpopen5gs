apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-upf-config
  labels:
    epc-mode: upf
data:
  upf.yaml: |
    logger:
      file:
        path: /var/log/open5gs/upf.log
    global:
      max:
        ue: 1024
    upf:
      pfcp:
        server:
          - dev: {{ .Values.k8s.interface }}
      gtpu:
        server:
          - dev: net1
            advertise: {{ .Values.k8s.advertise }}
      session:
        - subnet: 10.45.0.0/16
          gateway: 10.45.0.1
          dnn: {{ .Values.dnn }}
      {{- if .Values.metrics.enabled }}
      metrics:
        server:
          - address: 0.0.0.0
            port: {{ .Values.metrics.port }}
      {{- end }}
