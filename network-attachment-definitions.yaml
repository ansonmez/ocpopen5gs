# Example NAD shipped with the Helm chart (namespace open5gs, 192.168.50.200).
# ocpair03 GitOps NADs live in github.com/ansonmez/telcollamastack
# kubernetes/ueransim/{testuserplane,gnb-userplane,ue-userplane}-nad.yaml
# (192.168.135.200 / .201 / .250-254, Recreate on single-IP attachments).
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: testuserplane
  namespace: open5gs
spec:
  config: '{ "cniVersion": "0.3.1", "name": "testuplane", "type": "ipvlan", "master": "ens22", "mode": "l2", "ipam": {"type": "static","addresses": [{"address": "192.168.50.200/24"}] } }'
